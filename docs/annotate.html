<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LeafLab · Gán nhãn lá và tổn thương</title>
<style>body{font:16px system-ui;margin:30px auto;max-width:1100px;padding:0 20px;color:#183b2b;background:#f6f8f6}button,select,input{font:inherit;padding:9px;margin:5px}canvas{max-width:100%;border:1px solid #b6c8bc;background:white;cursor:crosshair}h1{font-size:26px}#status{min-height:25px}</style>
<h1>Gán nhãn lá và vết bệnh bằng đa giác</h1>
<p>1. Mở ảnh. 2. Chọn vùng lá và bấm các đỉnh quanh biên lá. 3. Nhấn Enter để đóng đa giác. 4. Chọn vùng tổn thương, vẽ từng vết bên trong lá. 5. Xuất JSON để kiểm tra và tạo mặt nạ.</p>
<input id="file" type="file" accept="image/*"><select id="kind"><option value="leaf">Vùng lá</option><option value="lesion">Vùng tổn thương</option></select>
<button id="close">Đóng đa giác Enter</button><button id="undo">Lùi một đỉnh</button><button id="remove">Xóa vùng cuối</button><button id="export">Xuất JSON</button>
<p id="status">Ảnh được xử lý ngay trong trình duyệt, không gửi lên máy chủ.</p><canvas id="canvas"></canvas>
<script>
const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d');
let picture=null,filename='',points=[],shapes=[];
function paint(){if(!picture)return;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(picture,0,0);for(const shape of shapes){ctx.beginPath();shape.points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fillStyle=shape.label==='leaf'?'#00c06055':'#ff302088';ctx.fill();ctx.strokeStyle=shape.label==='leaf'?'#00a050':'#e02020';ctx.lineWidth=Math.max(canvas.width/400,2);ctx.stroke();}if(points.length){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.strokeStyle='#ffee00';ctx.lineWidth=Math.max(canvas.width/400,2);ctx.stroke();}document.querySelector('#status').textContent=`${filename} · ${canvas.width} × ${canvas.height} · ${shapes.length} vùng · ${points.length} đỉnh đang vẽ`;}
document.querySelector('#file').onchange=async e=>{const file=e.target.files[0];if(!file)return;const url=URL.createObjectURL(file);picture=new Image();picture.onload=()=>{filename=file.name;canvas.width=picture.naturalWidth;canvas.height=picture.naturalHeight;points=[];shapes=[];paint();URL.revokeObjectURL(url)};picture.src=url};
canvas.onclick=e=>{if(!picture)return;const r=canvas.getBoundingClientRect();points.push([(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height]);paint()};
function closePolygon(){if(points.length<3)return;shapes.push({label:document.querySelector('#kind').value,points:[...points],shape_type:'polygon'});points=[];paint()}
document.querySelector('#close').onclick=closePolygon;document.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();closePolygon()}};
document.querySelector('#undo').onclick=()=>{points.pop();paint()};document.querySelector('#remove').onclick=()=>{shapes.pop();paint()};
document.querySelector('#export').onclick=()=>{if(!picture||points.length){alert('Đóng đa giác đang vẽ trước khi xuất.');return;}if(!shapes.some(s=>s.label==='leaf')){alert('Cần vùng lá.');return;}const data={imagePath:filename,imageWidth:canvas.width,imageHeight:canvas.height,shapes};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=filename.replace(/\.[^.]+$/,'')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></html>
